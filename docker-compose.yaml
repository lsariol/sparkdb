name: sparkdb

x-lighthouse:
  deploy: releases
  tier: data
  backup: postgres


services:
  db:
    image: postgres:16.4
    container_name: sparkdb
    environment:
      POSTGRES_DB: AdminDB
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: ${SPARKDB_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5000:5432"
    volumes:
      - /srv/server/storage/sparkdb/data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12
    networks:
      - spark

networks:
  spark:
    external: true
